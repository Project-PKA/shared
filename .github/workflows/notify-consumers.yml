name: Notify contract consumers

# Quando openapi.yaml muda na branch principal, dispara um evento
# repository_dispatch para cada repositório consumidor configurado abaixo,
# para que eles (ex.: via workflow próprio ouvindo esse evento) regenerem
# clients/types a partir do contrato atualizado.
#
# >>> PLACEHOLDER — configurar ao criar um projeto real a partir deste
# template (ver BOOTSTRAP.md, passo "configuração dos nomes dos
# repositórios de destino em notify-consumers.yml"):
#
#   1. Preencher a matriz `repo` abaixo com os repositórios da mesma
#      organização que devem ser notificados (ex.: "minha-org/backend",
#      "minha-org/frontend").
#   2. Criar um secret neste repositório chamado CONTRACT_DISPATCH_TOKEN,
#      com um token (fine-grained PAT ou GitHub App) que tenha permissão
#      de "Contents: read and write" (ou "Actions: write", dependendo de
#      como o repositório de destino consome o evento) nos repositórios
#      de destino. O GITHUB_TOKEN padrão NÃO tem permissão para disparar
#      eventos em outros repositórios.
#   3. Em cada repositório consumidor, criar um workflow que escute
#      `repository_dispatch` com o `event_type: openapi-contract-updated`
#      (ver exemplo comentado no final deste arquivo).

on:
  push:
    branches:
      - main
    paths:
      - "openapi.yaml"

permissions:
  contents: read

jobs:
  notify:
    name: Disparar repository_dispatch
    runs-on: ubuntu-latest
    env:
      # O token de outro repositório é uma ação do dono (OWNER.md, A2). Sem ele o job é pulado em
      # vez de falhar e mandar e-mail de erro a cada mudança do contrato.
      DISPATCH_TOKEN: ${{ secrets.CONTRACT_DISPATCH_TOKEN || secrets.AUTOMATION_TOKEN }}
    strategy:
      matrix:
        # >>> PLACEHOLDER: substituir pelos repositórios reais do projeto.
        repo:
          - "Project-PKA/frontend_web"
          # O Backend publica o contrato aqui (publish-contract.yml), não o consome.
          # O whatsapp_microservice acessa o banco, não a API: sem tipos gerados.
    steps:
      - name: Sem token configurado
        if: env.DISPATCH_TOKEN == ''
        run: echo "::notice::CONTRACT_DISPATCH_TOKEN (ou AUTOMATION_TOKEN) não configurado; ${{ matrix.repo }} não foi notificado."

      - name: Disparar evento para ${{ matrix.repo }}
        if: env.DISPATCH_TOKEN != ''
        uses: peter-evans/repository-dispatch@v3
        with:
          token: ${{ env.DISPATCH_TOKEN }}
          repository: ${{ matrix.repo }}
          event-type: openapi-contract-updated
          client-payload: >-
            {
              "ref": "${{ github.sha }}",
              "repository": "${{ github.repository }}",
              "contract_path": "openapi.yaml"
            }

