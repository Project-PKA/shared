# =============================================================================
# pokemonAuction: ambiente local COMPLETO para testar tudo junto.
#
# Pressupõe os repositórios lado a lado (`Backend` e `frontend_web` ao lado de `shared`). Constrói a
# API a partir do código local e roda o frontend em modo dev com recarga automática.
#
#   docker compose up -d --build           # sobe tudo (a primeira vez demora)
#   docker compose --profile bot up -d --build   # idem, com o bot de WhatsApp (sem conta pareada)
#   docker compose run --rm seed           # dados de exemplo (APAGA o banco; só desenvolvimento)
#   docker compose down                    # desliga (mantém os dados)
#   docker compose down -v                 # desliga e APAGA banco e arquivos
#
# Endereços (as portas mudam com as variáveis do `.env`, veja `.env.example`):
#   Frontend  http://localhost:3000        API       http://localhost:8081  (docs em /docs)
#   E-mails   http://localhost:8025        (Mailpit: o código de login chega aqui, nada sai da máquina)
#
# Contas do seed: dono@example.com, funcionario@example.com e admin@example.com. O login é por código
# enviado ao e-mail: peça o código na tela e abra o Mailpit.
#
# O bot de WhatsApp (`whatsapp_microservice`) só sobe com `--profile bot`.
#
# Outras pastas: BACKEND_DIR, WEB_DIR e BOT_DIR (padrão: ../Backend, ../frontend_web e
# ../whatsapp_microservice) apontam para outra cópia do código, por exemplo um `git worktree`.
# Outro ambiente ao mesmo tempo (testes): `docker compose -p outro ...` com portas diferentes no `.env`.
#
# Parear a conta de WhatsApp do bot ainda não é possível por aqui: falta o gatilho do painel (OWNER.md, D20).
# Enquanto isso o bot sobe sem sessão e só confere as lojas a cada minuto (health em :${BOT_PORT:-8082}).
# SÓ DESENVOLVIMENTO: os segredos abaixo são valores de teste, nunca usados fora desta máquina.
# =============================================================================
name: pokemon-auction-local

x-api-env: &api-env
  APP_ENV: local
  LOG_LEVEL: ${LOG_LEVEL:-info}
  DATABASE_URL: postgresql://app_api:app_api_dev_password_0123456789@db:5432/app
  REDIS_URL: redis://:app@redis:6379
  JWT_ACCESS_SECRET: dev-only-jwt-access-secret-change-me-0123456789
  REFRESH_TOKEN_PEPPER: dev-only-refresh-pepper-change-me-0123456789
  OTP_HASH_SECRET: dev-only-otp-hash-secret-change-me-0123456789
  # Mesma chave do seed (SEED_CPF_KEY do Backend): o CPF dos dados de exemplo só abre com ela.
  CPF_ENCRYPTION_KEY: &cpf-key dev-only-cpf-encryption-key-change-me-0123456789
  EMAIL_PROVIDER: smtp
  SMTP_HOST: mailpit
  SMTP_PORT: "1025"
  EMAIL_FROM: no-reply@pokemon-auction.local
  STORAGE_DIR: /app/storage
  APP_PUBLIC_URL: http://localhost:${WEB_PORT:-3000}
  CORS_ORIGINS: http://localhost:${WEB_PORT:-3000}

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
      POSTGRES_DB: app
    ports:
      - "127.0.0.1:${DB_PORT:-5432}:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--requirepass", "app", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a app ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Caixa de e-mail de desenvolvimento: recebe tudo que a API envia e mostra na web.
  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "127.0.0.1:${MAILPIT_WEB_PORT:-8025}:8025"
      - "127.0.0.1:${MAILPIT_SMTP_PORT:-1025}:1025"

  # Aplica as migrations e cria o papel de login da API (app_api, sem BYPASSRLS). Idempotente.
  setup:
    build:
      context: ${BACKEND_DIR:-../Backend}
    image: pokemon-auction-api:local
    command:
      - sh
      - -c
      - node dist/db/cli.js up && node dist/db/provision-cli.js
    environment:
      MIGRATION_DATABASE_URL: postgresql://app:app@db:5432/app
      DB_APP_PASSWORD: app_api_dev_password_0123456789
      DB_BOT_PASSWORD: bot_api_dev_password_0123456789  # login do bot de WhatsApp (bot_runtime)
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  # Dados de exemplo. APAGA o banco: por isso só roda quando você pede (`docker compose run --rm seed`).
  seed:
    profiles: [tools]
    image: pokemon-auction-api:local
    command: ["node", "dist/db/seed-cli.js"]
    environment:
      APP_ENV: local
      MIGRATION_DATABASE_URL: postgresql://app:app@db:5432/app
      CPF_ENCRYPTION_KEY: *cpf-key
    depends_on:
      setup:
        condition: service_completed_successfully

  # Cifra CPFs antigos (clientes anteriores à migration 0024): `docker compose run --rm encrypt-cpf`.
  encrypt-cpf:
    profiles: [tools]
    image: pokemon-auction-api:local
    command: ["node", "dist/db/encrypt-cpf.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://app:app@db:5432/app
      CPF_ENCRYPTION_KEY: *cpf-key
    depends_on:
      setup:
        condition: service_completed_successfully

  # Promove alguém a administrador da plataforma:
  #   docker compose run --rm create-admin voce@exemplo.com "Seu Nome"
  create-admin:
    profiles: [tools]
    image: pokemon-auction-api:local
    entrypoint: ["node", "dist/db/create-admin.js"]
    environment:
      MIGRATION_DATABASE_URL: postgresql://app:app@db:5432/app
    depends_on:
      setup:
        condition: service_completed_successfully

  api:
    image: pokemon-auction-api:local
    init: true
    environment:
      <<: *api-env
      PORT: "8080"
    ports:
      - "127.0.0.1:${API_PORT:-8081}:8080"
    volumes:
      - storage_data:/app/storage
    depends_on:
      setup:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      mailpit:
        condition: service_started

  # Frontend em modo dev (recarrega ao salvar). Usa o código de ../frontend_web; as dependências
  # ficam num volume do container (não mistura com o node_modules do Windows).
  web:
    image: node:22-alpine
    working_dir: /app
    command:
      - sh
      - -c
      - '[ -x node_modules/.bin/nuxt ] || npm ci --no-audit --no-fund; exec npx nuxt dev --host 0.0.0.0 --port 3000'
    environment:
      NUXT_PUBLIC_API_BASE_URL: http://localhost:${API_PORT:-8081}
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${WEB_PORT:-3000}:3000"
    volumes:
      - ${WEB_DIR:-../frontend_web}:/app
      - web_node_modules:/app/node_modules
    depends_on:
      - api

  # Bot de WhatsApp (perfil `bot`). Entra no banco com o login PRÓPRIO `bot_api` (grupo bot_runtime, sem
  # BYPASSRLS). Sem sessão pareada ele só fica de pé (health check) e confere as lojas a cada minuto.
  bot:
    profiles: [bot]
    build:
      context: ${BOT_DIR:-../whatsapp_microservice}
    image: pokemon-auction-bot:local
    init: true
    environment:
      ENVIRONMENT: development
      SERVICE_NAME: whatsapp-microservice
      LOG_LEVEL: ${LOG_LEVEL:-info}
      HEALTH_PORT: "8080"
      DATABASE_URL: postgresql://bot_api:bot_api_dev_password_0123456789@db:5432/app
      SESSION_DB_TEMPLATE: /app/sessions/{store_id}.sqlite3
      STORAGE_DIR: /app/storage
    ports:
      - "127.0.0.1:${BOT_PORT:-8082}:8080"
    volumes:
      - storage_data:/app/storage:ro
      - bot_sessions:/app/sessions
    depends_on:
      setup:
        condition: service_completed_successfully

volumes:
  bot_sessions:
  db_data:
  redis_data:
  storage_data:
  web_node_modules:
